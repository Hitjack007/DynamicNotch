name: Update bug report version list
on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  update-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch release tags
        run: |
          gh release list --limit 10 --json tagName --jq '[.[].tagName]' > /tmp/releases.json
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Update bug report version dropdown
        run: python3 .github/scripts/update_version_template.py /tmp/releases.json .github/ISSUE_TEMPLATE/1-bug-report-form.yml
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/ISSUE_TEMPLATE/1-bug-report-form.yml
          git diff --staged --quiet || (git commit -m "chore: update bug report version list" && git push origin HEAD:${{ github.event.repository.default_branch }})
