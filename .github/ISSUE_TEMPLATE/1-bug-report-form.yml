---
name: Bug Report
description: File a bug report.
title: "[Bug] "
type: Bug
labels:
  - unconfirmed
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: attachments
    attributes:
      label: "Attach Files & Screenshots Here"
      description: >-
        Please copy and paste any relevant log output, or drag a log file into
        the attachments field above. This will be automatically formatted
        into code, so no need for backticks. If you really don't want to
        attach logs, write "Not adding logs or similar" here — just know that
        skipping this can slow down how quickly we're able to diagnose and
        fix the issue
      placeholder: "Drop files here..."
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened? What are the steps to reproduce the issue?
      description: >-
        Describe the bug and include the steps to replicate the issue. Issues
        with images or videos will be resolved faster.
      placeholder: Clearly explain the issue. Please limit each post to one issue.
    validations:
      required: true
  - type: textarea
    id: expected-behaviour
    attributes:
      label: What did you expect to happen?
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: dropdown
    id: version
    attributes:
      label: DynamicNotch Version
      description: >-
        What version of our software are you running? (Go to ✦ in the menu bar >
        Settings > About)
      options:
        - Select a version
        - v27.4
        - v27.3.3
        - v27.3.2
        - v27.3.1
        - v27.3
        - v27.2
        - v27.1
        - v27.0.2
        - v27.0.1
        - v27.0
    validations:
      required: true
  - type: input
    id: operating-system
    attributes:
      label: macOS Version
      description: Go to  > About This Mac
    validations:
      required: true
  - type: dropdown
    id: music-source
    attributes:
      label: Music Source? (If relevant)
      description: >-
        If this issue is related to music, what music source did you select in DynamicNotch settings?
      options:
        - Now Playing
        - Apple Music
        - Spotify
        - YouTube Music
    validations:
      required: false
  - type: input
    id: music-app
    attributes:
      label: Music App (If using Now Playing)
    validations:
      required: false
  - type: input
    id: music-website
    attributes:
      label: Website (If using browser for music)
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      description:
      options:
        - label: I haven't found any duplicates with my issue.
          required: true
